name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slack_workplace_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/slack_workplace_assistant
        run: alembic upgrade head

      - name: Check for uncommitted migration drift
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/slack_workplace_assistant
        run: alembic check

      - name: Run lint
        run: ruff check app tests

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/slack_workplace_assistant
        run: pytest
